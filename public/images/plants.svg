<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe8db"/>
      <stop offset="1" stop-color="#e2d8c6"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a7550"/>
      <stop offset="1" stop-color="#6f5236"/>
    </linearGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9e1d3"/>
      <stop offset="1" stop-color="#cdbfa8"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#1a1408" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="light" cx="0.2" cy="0.15" r="0.7">
      <stop offset="0" stop-color="#fffaf0" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fffaf0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="900" fill="url(#wall)"/>
  <rect width="600" height="900" fill="url(#light)"/>
  <!-- window light -->
  <g fill="#fff" opacity="0.35">
    <path d="M60 60h150v260H60z"/>
    <path d="M230 60h150v260H230z"/>
  </g>

  <!-- tall plant stems -->
  <g stroke="#4a6a3f" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M300 640C300 520 260 420 200 330"/>
    <path d="M300 640C305 500 340 400 410 300"/>
    <path d="M300 640C298 540 300 430 296 250"/>
    <path d="M300 640C280 560 230 520 150 480"/>
    <path d="M300 640C330 570 390 540 470 520"/>
  </g>
  <!-- leaves -->
  <g>
    <ellipse cx="190" cy="315" rx="70" ry="40" transform="rotate(-35 190 315)" fill="#2f5537"/>
    <ellipse cx="420" cy="285" rx="72" ry="42" transform="rotate(30 420 285)" fill="#2f5537"/>
    <ellipse cx="296" cy="225" rx="44" ry="80" fill="#3e6b45"/>
    <ellipse cx="140" cy="470" rx="70" ry="36" transform="rotate(-15 140 470)" fill="#3e6b45"/>
    <ellipse cx="480" cy="510" rx="70" ry="36" transform="rotate(12 480 510)" fill="#3e6b45"/>
    <ellipse cx="240" cy="400" rx="56" ry="30" transform="rotate(-40 240 400)" fill="#5b8a5a"/>
    <ellipse cx="365" cy="390" rx="56" ry="30" transform="rotate(38 365 390)" fill="#5b8a5a"/>
    <ellipse cx="300" cy="330" rx="30" ry="52" fill="#6f9c6a"/>
  </g>
  <g stroke="#1f3a25" stroke-width="2" fill="none" opacity="0.6">
    <path d="M140 350L240 280M380 250L465 320M296 160V300M85 480L195 460M425 505L535 515"/>
  </g>

  <!-- table -->
  <rect x="0" y="760" width="600" height="140" fill="url(#table)"/>
  <rect x="0" y="752" width="600" height="14" fill="#a6825c"/>

  <!-- main pot -->
  <path d="M220 620h160l-18 140H238z" fill="url(#pot)"/>
  <rect x="212" y="606" width="176" height="22" rx="6" fill="#e6ddcd"/>

  <!-- small pot right -->
  <path d="M430 680h80l-10 80h-60z" fill="#bfae92"/>
  <ellipse cx="470" cy="650" rx="44" ry="38" fill="#3e6b45"/>
  <ellipse cx="455" cy="640" rx="20" ry="26" fill="#5b8a5a"/>

  <!-- candle left -->
  <rect x="96" y="680" width="46" height="80" rx="6" fill="#f7f1e6"/>
  <path d="M119 664c6 8 6 14 0 18-6-4-6-10 0-18z" fill="#f2b44e"/>
  <rect x="117" y="676" width="4" height="8" fill="#3a2a1a"/>
  <!-- book stack -->
  <rect x="30" y="728" width="120" height="16" rx="2" fill="#5d7a5a"/>
  <rect x="38" y="712" width="104" height="16" rx="2" fill="#d8c7a4"/>

  <rect width="600" height="900" fill="url(#shade)"/>
</svg>
