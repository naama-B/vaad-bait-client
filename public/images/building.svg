<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3ead8"/>
      <stop offset="0.6" stop-color="#e9dfcb"/>
      <stop offset="1" stop-color="#d8cdb6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9b9b2"/>
      <stop offset="0.55" stop-color="#7d928c"/>
      <stop offset="1" stop-color="#5d716b"/>
    </linearGradient>
    <linearGradient id="glassWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c98e"/>
      <stop offset="1" stop-color="#c79a55"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e7dece"/>
      <stop offset="1" stop-color="#d9cfbc"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#0d1a10" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#fff6df" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff6df" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#sky)"/>
  <rect width="800" height="1000" fill="url(#sun)"/>

  <!-- building -->
  <rect x="150" y="120" width="560" height="880" fill="url(#stone)"/>
  <g stroke="#c9bda6" stroke-width="1.5">
    <path d="M150 220H710M150 320H710M150 420H710M150 520H710M150 620H710M150 720H710M150 820H710"/>
  </g>
  <rect x="140" y="110" width="580" height="18" fill="#cfc3ac"/>

  <!-- window column 1 -->
  <g>
    <rect x="200" y="160" width="150" height="230" fill="#2b2b28"/>
    <rect x="208" y="168" width="134" height="214" fill="url(#glass)"/>
    <path d="M275 168V382M208 275H342" stroke="#2b2b28" stroke-width="6"/>
    <rect x="190" y="388" width="170" height="10" fill="#bfb39b"/>
  </g>
  <g>
    <rect x="200" y="450" width="150" height="230" fill="#2b2b28"/>
    <rect x="208" y="458" width="134" height="214" fill="url(#glassWarm)"/>
    <path d="M275 458V672M208 565H342" stroke="#2b2b28" stroke-width="6"/>
    <rect x="190" y="678" width="170" height="10" fill="#bfb39b"/>
  </g>
  <!-- window column 2 -->
  <g>
    <rect x="430" y="160" width="230" height="230" fill="#2b2b28"/>
    <rect x="438" y="168" width="214" height="214" fill="url(#glass)"/>
    <path d="M545 168V382M438 275H652" stroke="#2b2b28" stroke-width="6"/>
    <path d="M430 395H660" stroke="#2b2b28" stroke-width="4"/>
    <path d="M440 395V370M470 395V370M500 395V370M530 395V370M560 395V370M590 395V370M620 395V370M650 395V370" stroke="#2b2b28" stroke-width="3"/>
    <path d="M430 370H660" stroke="#2b2b28" stroke-width="3"/>
  </g>
  <g>
    <rect x="430" y="450" width="230" height="230" fill="#2b2b28"/>
    <rect x="438" y="458" width="214" height="214" fill="url(#glass)"/>
    <path d="M545 458V672M438 565H652" stroke="#2b2b28" stroke-width="6"/>
  </g>

  <!-- entrance -->
  <rect x="380" y="760" width="250" height="240" fill="#2b2b28"/>
  <rect x="390" y="770" width="230" height="230" fill="url(#glassWarm)"/>
  <path d="M505 770V1000M390 860H620" stroke="#2b2b28" stroke-width="6"/>
  <rect x="360" y="742" width="290" height="20" fill="#2f2f2b"/>
  <rect x="200" y="760" width="150" height="160" fill="#2b2b28"/>
  <rect x="208" y="768" width="134" height="144" fill="url(#glass)"/>

  <!-- planter boxes on sills -->
  <g fill="#3f6b43">
    <ellipse cx="225" cy="380" rx="26" ry="16"/>
    <ellipse cx="255" cy="374" rx="22" ry="18"/>
    <ellipse cx="320" cy="378" rx="28" ry="15"/>
    <ellipse cx="230" cy="672" rx="26" ry="15"/>
    <ellipse cx="300" cy="668" rx="30" ry="18"/>
  </g>
  <g fill="#5d8a58">
    <ellipse cx="243" cy="366" rx="16" ry="12"/>
    <ellipse cx="300" cy="370" rx="18" ry="11"/>
    <ellipse cx="270" cy="660" rx="18" ry="12"/>
  </g>

  <!-- left tree -->
  <rect x="78" y="520" width="14" height="480" fill="#5a4630"/>
  <g>
    <circle cx="85" cy="430" r="110" fill="#2f5537"/>
    <circle cx="20" cy="520" r="90" fill="#3e6b45"/>
    <circle cx="150" cy="520" r="80" fill="#3e6b45"/>
    <circle cx="70" cy="340" r="70" fill="#4b7a4d"/>
    <circle cx="125" cy="400" r="60" fill="#5b8a5a"/>
    <circle cx="40" cy="430" r="55" fill="#5b8a5a"/>
    <circle cx="100" cy="300" r="40" fill="#6f9c6a"/>
  </g>

  <!-- bushes front -->
  <g>
    <ellipse cx="120" cy="980" rx="190" ry="90" fill="#2f5537"/>
    <ellipse cx="300" cy="990" rx="120" ry="70" fill="#3e6b45"/>
    <ellipse cx="720" cy="985" rx="150" ry="85" fill="#2f5537"/>
    <ellipse cx="650" cy="1000" rx="90" ry="60" fill="#4b7a4d"/>
    <ellipse cx="200" cy="955" rx="70" ry="40" fill="#5b8a5a"/>
    <ellipse cx="760" cy="945" rx="60" ry="36" fill="#5b8a5a"/>
  </g>
  <!-- pots by the door -->
  <g>
    <path d="M330 930h44l-6 70h-32z" fill="#cdbfa6"/>
    <ellipse cx="352" cy="905" rx="26" ry="34" fill="#3e6b45"/>
    <ellipse cx="342" cy="890" rx="12" ry="22" fill="#5b8a5a"/>
    <path d="M636 930h44l-6 70h-32z" fill="#cdbfa6"/>
    <ellipse cx="658" cy="905" rx="26" ry="34" fill="#3e6b45"/>
    <ellipse cx="668" cy="890" rx="12" ry="22" fill="#5b8a5a"/>
  </g>

  <rect width="800" height="1000" fill="url(#shade)"/>
</svg>
